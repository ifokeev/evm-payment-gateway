services:
  gateway:
    build: .
    env_file: .env
    ports:
      - "8090:8090"
    volumes:
      - gateway-data:/pb_data
    restart: unless-stopped

  sweeper:
    build: .
    command: ["sweeper"]
    env_file: .sweeper.env
    environment:
      SWEEPER_API_KEY: ${SWEEPER_API_KEY}
      DEPOSIT_XPUB: ${DEPOSIT_XPUB}
      SWEEPER_MAX_GAS_FUNDING_WEI: ${SWEEPER_MAX_GAS_FUNDING_WEI:-10000000000000000}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      ETHEREUM_TREASURY_ADDRESS: ${ETHEREUM_TREASURY_ADDRESS:-}
      ETHEREUM_SEPOLIA_RPC_URL: ${ETHEREUM_SEPOLIA_RPC_URL:-}
      ETHEREUM_SEPOLIA_TREASURY_ADDRESS: ${ETHEREUM_SEPOLIA_TREASURY_ADDRESS:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      BASE_TREASURY_ADDRESS: ${BASE_TREASURY_ADDRESS:-}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-}
      BASE_SEPOLIA_TREASURY_ADDRESS: ${BASE_SEPOLIA_TREASURY_ADDRESS:-}
      BNB_RPC_URL: ${BNB_RPC_URL:-}
      BNB_TREASURY_ADDRESS: ${BNB_TREASURY_ADDRESS:-}
      BNB_TESTNET_RPC_URL: ${BNB_TESTNET_RPC_URL:-}
      BNB_TESTNET_TREASURY_ADDRESS: ${BNB_TESTNET_TREASURY_ADDRESS:-}
    depends_on:
      - gateway
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  gateway-data:
