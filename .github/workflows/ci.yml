name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy-testnet:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: testnet
      url: https://evm-payment-gateway-showcase-testnet.ivan-23c.workers.dev
    concurrency:
      group: testnet-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check testnet deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYMENT_API_KEY: ${{ secrets.TESTNET_PAYMENT_API_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.TESTNET_PAYMENT_WEBHOOK_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TESTNET_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TESTNET_TURNSTILE_SECRET_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAYMENT_API_KEY PAYMENT_WEBHOOK_SECRET TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "### Testnet deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing repository secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing testnet deployment secrets:$missing"
            exit 1
          fi
      - name: Deploy testnet backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --remote --env testnet --config wrangler.api.jsonc
          npx wrangler deploy --env testnet --config wrangler.api.jsonc
          npx wrangler deploy --env testnet --config wrangler.sweeper.jsonc
      - name: Write testnet demo secrets
        env:
          PAYMENT_API_KEY: ${{ secrets.TESTNET_PAYMENT_API_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.TESTNET_PAYMENT_WEBHOOK_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TESTNET_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TESTNET_TURNSTILE_SECRET_KEY }}
        run: |
          umask 077
          printf '%s\n' \
            "PAYMENT_API_KEY=$PAYMENT_API_KEY" \
            "PAYMENT_WEBHOOK_SECRET=$PAYMENT_WEBHOOK_SECRET" \
            "TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY" \
            "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY" \
            > .demo.secrets
      - run: npm run deploy:demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify testnet services
        run: |
          curl --fail-with-body --silent --show-error \
            https://evm-payment-gateway-showcase-testnet.ivan-23c.workers.dev/api/signer/withdrawals \
            > /dev/null
          curl --fail-with-body --silent --show-error \
            https://evm-payment-gateway-showcase-testnet.ivan-23c.workers.dev/api/analytics \
            > /dev/null
