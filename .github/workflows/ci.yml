name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write testnet demo secrets
        env:
          PAYMENT_API_KEY: ${{ secrets.TESTNET_PAYMENT_API_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.TESTNET_PAYMENT_WEBHOOK_SECRET }}
          DEMO_SESSION_SECRET: ${{ secrets.TESTNET_DEMO_SESSION_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TESTNET_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TESTNET_TURNSTILE_SECRET_KEY }}
        run: |
          umask 077
          printf '%s\n' \
            "PAYMENT_API_KEY=$PAYMENT_API_KEY" \
            "PAYMENT_WEBHOOK_SECRET=$PAYMENT_WEBHOOK_SECRET" \
            "DEMO_SESSION_SECRET=$DEMO_SESSION_SECRET" \
            "TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY" \
            "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY" \
            > .demo.secrets
      - run: npm run deploy:demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
